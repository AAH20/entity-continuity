[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-continuity"
version = "0.2.0"
description = "Inspectable entity lifecycle, obligation, authority, and evidence reference engine"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
entity-continuity = "entity_continuity.cli:main"
entity-continuity-verify = "entity_continuity.verify_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
