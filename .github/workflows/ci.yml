name: Reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: PYTHONPATH=src python3 -m entity_continuity.cli examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json --as-of 2026-09-23 > /tmp/passport.json
      - run: python3 -m json.tool /tmp/passport.json > /dev/null
