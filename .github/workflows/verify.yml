name: Verify synthetic reference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Recompute exact-input synthetic receipt
        run: |
          PYTHONPATH=src python -m entity_continuity.cli examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json --as-of 2026-09-23 --output /tmp/entity-continuity-passport.json
          PYTHONPATH=src python -m entity_continuity.verify_cli examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json /tmp/entity-continuity-passport.json --as-of 2026-09-23
      - name: Export v2 human-review handoff
        run: |
          PYTHONPATH=src python -m entity_continuity.a2z_cli examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json /tmp/entity-continuity-passport.json --as-of 2026-09-23 --output /tmp/entity-a2z-handoff.json
          python -m json.tool /tmp/entity-a2z-handoff.json > /dev/null
      - name: Verify exact-source synthetic intake
        run: |
          PYTHONPATH=src python -m entity_continuity.intake_cli examples/synthetic-read-only-intake-manifest.json examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json --as-of 2026-09-23 --output /tmp/entity-intake.json
          PYTHONPATH=src python -m entity_continuity.intake_verify_cli examples/synthetic-read-only-intake-manifest.json examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json /tmp/entity-intake.json --as-of 2026-09-23
