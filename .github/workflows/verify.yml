name: Verify synthetic reference

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Recompute exact-input synthetic receipt
        run: |
          PYTHONPATH=src python -m entity_continuity.cli examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json --as-of 2026-09-23 --output /tmp/entity-continuity-passport.json
          PYTHONPATH=src python -m entity_continuity.verify_cli examples/egypt-to-us-synthetic-case.json examples/us-de-synthetic-pack.json /tmp/entity-continuity-passport.json --as-of 2026-09-23
